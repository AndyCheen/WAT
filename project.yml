name: WaterTracker
options:
  bundleIdPrefix: com.watertracker
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    # Підпис — одне місце (WAT-69): `make project` перегенеровує .xcodeproj, і вибране в інтерфейсі Xcode
    # скидається. Ідентифікатори глобальні в Apple: `com.watertracker.app` і його група вже зайняті.
    # Змінити ідентифікатор — інший застосунок для iOS: дані на телефоні не перейдуть.
    DEVELOPMENT_TEAM: JB97732VJB
    APP_BUNDLE_ID: com.andriitkachenko1228.watertracker.app
    APP_GROUP_ID: group.com.andriitkachenko1228.watertracker.app
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Core:
    path: Packages/Core
  Persistence:
    path: Packages/Persistence
  Metrics:
    path: Packages/Metrics
  Hydration:
    path: Packages/Hydration
  Gamification:
    path: Packages/Gamification
  Insights:
    path: Packages/Insights
  Notifications:
    path: Packages/Notifications
  DesignSystem:
    path: Packages/DesignSystem
  Widgets:
    path: Packages/Widgets
  Features:
    path: Packages/Features

targets:
  WaterTracker:
    type: application
    platform: iOS
    # Баланс XP — у конфігурації, а не в коді (SPEC-PRIZES §16.13).
    configFiles:
      Debug: Config/Balance.xcconfig
      Release: Config/Balance.xcconfig
    sources:
      - path: App/Sources
      # Інтенти кнопок віджетів — в обох цілях: розширенню для `Button(intent:)`, застосунку — щоб виконати
      # (`ForegroundContinuableIntent` іде в процесі застосунку, SPEC-WIDGETS §9.2).
      - path: App/Shared
      - path: App/Resources
        buildPhase: resources
    # App Group — знімок для віджетів (SPEC-WIDGETS §9.1).
    entitlements:
      path: App/WaterTracker.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Вода
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Fredoka.ttf
          - Nunito.ttf
        # Тапи по віджетах: watertracker://home|custom|stats|progress (`WidgetLink`).
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes:
              - watertracker
        # Фонове оновлення плану сповіщень — лише бонус, план від нього не залежить (SPEC-NOTIFICATIONS §16.3).
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.watertracker.app.refresh
        # Баланс XP з Config/Balance.xcconfig — читає `AppContainer` (SPEC-PRIZES §16.13).
        WT_XP_PER_VOLUME_STEP: $(WT_XP_PER_VOLUME_STEP)
        WT_XP_VOLUME_STEP_ML: $(WT_XP_VOLUME_STEP_ML)
        WT_XP_MULTIPLIER: $(WT_XP_MULTIPLIER)
        # Група для знімка віджетів — код читає її звідси (`WidgetSnapshotStore.appGroup`), а не з рядка в коді.
        WTAppGroup: $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Core
      - package: Persistence
      - package: Metrics
      - package: Hydration
      - package: Gamification
      - package: Insights
      - package: Notifications
      - package: DesignSystem
      - package: Widgets
      - package: Features
      - target: WaterTrackerWidgets
        embed: true
        codeSign: true

  # Віджети, екран блокування й Пункт керування (WAT-30). Лише пакет `Widgets` — без SwiftData й сервісів:
  # дані — знімок у App Group, дії — інтенти в процесі застосунку.
  WaterTrackerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension/Sources
      - path: App/Shared
      - path: App/Resources/Fonts
        buildPhase: resources
    entitlements:
      path: WidgetExtension/WaterTrackerWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Вода
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        WTAppGroup: $(APP_GROUP_ID)
        UIAppFonts:
          - Fredoka.ttf
          - Nunito.ttf
    settings:
      base:
        # iOS вимагає ідентифікатор розширення з префіксом застосунку.
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        # Тіло `perform()` спільних інтентів — лише в застосунку.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
    dependencies:
      - package: Widgets

  WaterTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/AppUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WaterTracker
    dependencies:
      - target: WaterTracker

schemes:
  WaterTracker:
    build:
      targets:
        WaterTracker: all
        WaterTrackerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WaterTrackerUITests
