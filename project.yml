name: WaterTracker
options:
  bundleIdPrefix: com.watertracker
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Core:
    path: Packages/Core
  Persistence:
    path: Packages/Persistence
  Metrics:
    path: Packages/Metrics
  Hydration:
    path: Packages/Hydration
  Gamification:
    path: Packages/Gamification
  Insights:
    path: Packages/Insights
  DesignSystem:
    path: Packages/DesignSystem
  Features:
    path: Packages/Features

targets:
  WaterTracker:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Вода
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Fredoka.ttf
          - Nunito.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watertracker.app
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Core
      - package: Persistence
      - package: Metrics
      - package: Hydration
      - package: Gamification
      - package: Insights
      - package: DesignSystem
      - package: Features

  WaterTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/AppUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watertracker.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WaterTracker
    dependencies:
      - target: WaterTracker

schemes:
  WaterTracker:
    build:
      targets:
        WaterTracker: all
        WaterTrackerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WaterTrackerUITests
